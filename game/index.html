<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Sizzle &amp; Serve — a tiny bistro cooking game</title>

</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>

</div>
